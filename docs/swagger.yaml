host: localhost:8080
info:
  contact: {}
  description: REST API del sistema hospitalario Galenos Pro. Arquitectura hexagonal,
    persiste en SQL Server 2022.
  title: Galenos Pro Appointments API
  version: "1.0"
paths:
  /api/v1/evoluciones:
    post:
      consumes:
      - application/json
      description: Saves a new medical evolution
      parameters:
      - description: Evolution data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpadapter.SaveEvolucionRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Save an evolution
      tags:
      - Evoluciones
  /api/v1/evoluciones/{idRegAtencion}/motivos:
    get:
      consumes:
      - application/json
      description: Returns the saved reasons for attention for a given registration
        ID
      parameters:
      - description: ID of the Registration / Encounter
        in: path
        name: idRegAtencion
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get motivos de atencion for a patient evolution
      tags:
      - Evoluciones
    post:
      consumes:
      - application/json
      description: Saves a new reason for attention in a patient's evolution
      parameters:
      - description: ID of the Registration / Encounter
        in: path
        name: idRegAtencion
        required: true
        type: integer
      - description: Motivo data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpadapter.SaveMotivoRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Save a motivo de atencion
      tags:
      - Evoluciones
  /api/v1/evoluciones/{idRegAtencion}/sintomas:
    post:
      consumes:
      - application/json
      description: Reemplaza los síntomas seleccionados de la evolución (sp_go_InsertarEvolucionSintomas)
      parameters:
      - description: ID of the Registration / Encounter
        in: path
        name: idRegAtencion
        required: true
        type: integer
      - description: Síntomas seleccionados
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpadapter.GuardarSintomasRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Guardar síntomas seleccionados de la evolución
      tags:
      - Evoluciones
  /api/v1/evoluciones/paciente/{pacienteId}:
    get:
      consumes:
      - application/json
      description: Returns the saved medical evolutions for a given registration ID
      parameters:
      - description: ID of the Registration / Encounter
        in: path
        name: pacienteId
        required: true
        type: integer
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get evolutions for a patient
      tags:
      - Evoluciones
  /api/v1/evoluciones/pacientes:
    get:
      consumes:
      - application/json
      description: Returns a list of patients with an attention within the date range
        (Atenciones.FechaIngreso). If fini/ffin are omitted, returns the most recent
        50.
      parameters:
      - description: Fecha inicial (YYYY-MM-DD)
        in: query
        name: fini
        type: string
      - description: Fecha final (YYYY-MM-DD)
        in: query
        name: ffin
        type: string
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: List patients for the medical evolution tray
      tags:
      - Evoluciones
  /api/v1/interconsultas:
    post:
      consumes:
      - application/json
      description: Creates a new interconsulta request
      parameters:
      - description: Interconsulta data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpadapter.CreateInterconsultaRequest'
      produces:
