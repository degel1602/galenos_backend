            - properties:
                error:
                  $ref: '#/definitions/internal_adapters_input_http.apiError'
              type: object
      summary: Lista centros poblados por distrito
      tags:
      - Catalogos
  /datos-institucion:
    get:
      description: Devuelve los datos de la institución (SP webParametrosDatosInstitucion).
