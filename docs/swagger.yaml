host: localhost:8080
info:
  contact: {}
  description: REST API del sistema hospitalario Galenos Pro. Arquitectura hexagonal,
    persiste en SQL Server 2022.
  title: Galenos Pro Appointments API
  version: "1.0"
paths:
  /appointments:
    post:
      consumes:
      - application/json
      description: Valida los datos del paciente, médico y horario, y agenda la cita
        si el médico está disponible.
      parameters:
      - description: Datos de la cita a agendar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_input_http.createAppointmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_input_http.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_galenos-pro_appointments-api_internal_domain.Appointment'
              type: object
        "400":
          description: Validación inválida
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_input_http.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_adapters_input_http.apiError'
              type: object
        "409":
          description: El médico no está disponible en ese horario
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_input_http.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_adapters_input_http.apiError'
              type: object
      summary: Agenda una nueva cita médica
      tags:
      - Appointments
  /appointments/{id}:
    get:
      description: Devuelve la cita identificada por su id.
      parameters:
      - description: ID de la cita
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_input_http.apiResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_galenos-pro_appointments-api_internal_domain.Appointment'
              type: object
        "404":
          description: Cita no encontrada
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_input_http.apiResponse'
            - properties:
                error:
                  $ref: '#/definitions/internal_adapters_input_http.apiError'
              type: object
      summary: Obtiene una cita médica por id
      tags:
      - Appointments
  /centros-poblados/{idDistrito}:
    get:
      description: Devuelve los centros poblados de un distrito (SP usp_go_ListarCentrosPoblados).
      parameters:
